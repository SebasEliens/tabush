# Local stack. Every service is a plain OCI container configured by env vars,
# so the same images run on any cloud (ECS, Cloud Run, Azure Container Apps,
# Kubernetes, a VM). Backing services (Postgres/PostGIS, TypeDB, object
# storage, API) get added here as they are built.
#
#   docker compose up --build            # production-like build on :8080
#   docker compose --profile dev up      # Vite hot reload on :5173

services:
  web:
    build:
      context: ./web
      target: runtime
    ports:
      - "8080:8080"
    environment:
      TABUSH_API_URL: ""          # empty = in-browser mock API
      TABUSH_MAP_STYLE_URL: ""    # empty = OSM raster tiles
      TABUSH_TILES_URL: "/tiles"  # public data layers; object storage + CDN in the cloud
      TABUSH_OPEN_DATA_URL: "/open"  # GeoParquet 2.0 + graph tables for "Ask the data"
      TABUSH_LLM_URL: ""          # Claude API proxy; empty = assistant off, worked examples only
    volumes:
      # Built by the tabush.ingest modules (see web/README.md); never committed.
      - ./data/tiles:/usr/share/nginx/html/tiles:ro
      - ./data/open:/usr/share/nginx/html/open:ro

  web-dev:
    profiles: ["dev"]
    build:
      context: ./web
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
      - ./data/tiles:/data/tiles:ro   # served at /tiles by vite.config.ts
      - ./data/open:/data/open:ro     # served at /open by vite.config.ts
    env_file:
      - path: .env                    # ANTHROPIC_API_KEY for the /llm proxy
        required: false

server {
  listen 8080;
  root /usr/share/nginx/html;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # Runtime config must never be cached, it changes per environment.
  location = /config.js { add_header Cache-Control "no-store"; }

  # Public data tiles, mounted from data/tiles in local dev. In the cloud
  # TABUSH_TILES_URL points at object storage + CDN in a Brazil region instead.
  # PMTiles are read with HTTP range requests, which nginx serves natively.
  location /tiles/ { add_header Cache-Control "public, max-age=3600"; }

  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # SPA fallback
  location / { try_files $uri /index.html; }
}

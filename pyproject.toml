[project]
name = "tabush"
version = "0.1.0"
description = "Rural property knowledge graph and climate-risk platform for Brazilian family farmers"
readme = "README.md"
authors = [
    { name = "Sebas Eliëns" }
]
requires-python = ">=3.12"
dependencies = [
    "geoalchemy2>=0.21.0",
    "geopandas>=1.2.0",
    "h3>=4.5.0",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.1",
    "pyproj>=3.8.0",
    "python-dotenv>=1.2.4",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.8",
    "typedb-driver>=3.14.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
